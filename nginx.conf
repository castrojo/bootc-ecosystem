server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense-in-depth for the static site).
    # script-src/style-src are 'self'-only: all component scripts are built
    # as external hashed files (astro.config.mjs sets assetsInlineLimit: 0)
    # and the one script that must run inline pre-paint (theme-init.js) is
    # loaded via <script src>, not inlined. style-src needs 'unsafe-inline'
    # for the per-element inline `style="..."` attributes used for
    # data-driven colors/widths (e.g. DORA/success-rate badges).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;

    location /bootc-ecosystem/ {
        try_files $uri $uri/ /bootc-ecosystem/index.html;
    }

    location = /healthz {
        return 200 "ok";
    }
}
