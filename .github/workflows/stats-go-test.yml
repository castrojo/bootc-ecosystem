name: stats-go Tests

on:
  pull_request:
    paths:
      - "stats-go/**"
      - "go.work"
      - ".github/workflows/stats-go-test.yml"
  push:
    branches: [main]
    paths:
      - "stats-go/**"
      - "go.work"
      - ".github/workflows/stats-go-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: stats-go/go.mod
          cache-dependency-path: stats-go/go.sum

      - name: Vet
        run: cd stats-go && go vet ./...

      - name: Test
        run: cd stats-go && go test ./... -race -count=1
